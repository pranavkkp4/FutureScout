[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futurescout"
version = "0.1.0"
description = "Reproducible NFL fourth-down and quarterback salary efficiency analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "requests>=2.31",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["analysis*"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
